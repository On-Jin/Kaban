services:
  kaban:
    container_name: kaban
    image: kaban:latest
    restart: always
    ports:
      - 5264:5264
      - 7001:7001
    environment:
      - KABANDBCONNECTIONSTRING=${KABANDBCONNECTIONSTRING}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_SECRET=${DISCORD_SECRET}

networks:
  default:
    external: true
    name: nginxproxymanager_default
